<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Route Optimizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0f11;
      --surface:   #16181c;
      --border:    #2a2d34;
      --accent:    #00e5a0;
      --accent2:   #005c41;
      --text:      #e8eaed;
      --muted:     #6b7280;
      --danger:    #ff4d4d;
      --mono:      'Space Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ── layout ── */
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── header ── */
    header {
      margin-bottom: 2.5rem;
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
    }
    header h1 {
      font-family: var(--mono);
      font-size: 1.6rem;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
    header p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    /* ── card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card-title {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── location inputs ── */
    #location-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .loc-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

    .loc-num {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      width: 1.4rem;
      text-align: right;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    .btn-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.3rem;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-remove:hover { color: var(--danger); }

    /* ── add stop ── */
    .btn-add {
      margin-top: 0.75rem;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      width: 100%;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── settings row ── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 500px) { .settings-grid { grid-template-columns: 1fr; } }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-family: var(--mono);
    }
    .field input, .field select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--surface); }

    /* ── submit ── */
    .btn-optimize {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #000;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.85rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-optimize:hover  { opacity: 0.88; }
    .btn-optimize:active { transform: scale(0.99); }
    .btn-optimize:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── loader ── */
    .loader {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }
    .loader span { animation: blink 1.2s infinite; }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* ── error ── */
    .error-box {
      display: none;
      background: #1a0a0a;
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    /* ── results ── */
    #results { display: none; }

    .stop-list { display: flex; flex-direction: column; gap: 0; }

    .stop-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease both;
    }
    .stop-item:last-child { border-bottom: none; }

    .stop-badge {
      background: var(--accent2);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .stop-name { font-size: 0.9rem; line-height: 1.4; }
    .stop-leg  { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; font-family: var(--mono); }

    /* ── stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 480px) { .stats-row { grid-template-columns: 1fr 1fr; } }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .stat-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 1.3rem;
      color: var(--accent);
      font-weight: 700;
    }
    .stat-unit { font-size: 0.7rem; color: var(--muted); margin-left: 0.2rem; }

    /* ── maps button ── */
    .btn-maps {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 0.75rem;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s;
      margin-top: 1rem;
    }
    .btn-maps:hover { background: var(--accent2); }

    /* ── return chip ── */
    .return-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.78rem;
      font-family: var(--mono);
      padding: 0.35rem 0.75rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>⚡ ROUTE OPTIMIZER</h1>
    <p>Find the most efficient driving order for your stops.</p>
  </header>

  <!-- ── Error ── -->
  <div class="error-box" id="error-box"></div>

  <!-- ── Locations ── -->
  <div class="card">
    <div class="card-title">📍 Your Stops</div>
    <div id="location-list">
      <div class="loc-row"><span class="loc-num">1.</span><input type="text" placeholder="e.g. SM Mall of Asia, Pasay"/><button class="btn-remove" onclick="removeStop(this)">✕</button></div>
      <div class="loc-row"><span class="loc-num">2.</span><input type="text" placeholder="e.g. Bonifacio Global City, Taguig"/><button class="btn-remove" onclick="removeStop(this)">✕</button></div>
      <div class="loc-row"><span class="loc-num">3.</span><input type="text" placeholder="e.g. Makati CBD"/><button class="btn-remove" onclick="removeStop(this)">✕</button></div>
    </div>
    <button class="btn-add" onclick="addStop()">+ Add Stop</button>
  </div>

  <!-- ── Settings ── -->
  <div class="card">
    <div class="card-title">⚙️ Settings</div>
    <div class="settings-grid">
      <div class="field">
        <label>Starting Stop #</label>
        <input type="number" id="start-index" value="1" min="1"/>
      </div>
      <div class="field">
        <label>Fuel Type</label>
        <select id="fuel-type">
          <option value="gasoline">Gasoline</option>
          <option value="diesel" selected>Diesel</option>
        </select>
      </div>
      <div class="field">
        <label>Consumption (km/L)</label>
        <input type="number" id="km-per-liter" value="30" step="0.5" min="1"/>
      </div>
      <div class="field">
        <label>Price per Liter (PHP)</label>
        <input type="number" id="price-per-liter" value="61.30" step="0.01" min="1"/>
      </div>
    </div>
  </div>

  <!-- ── Submit ── -->
  <button class="btn-optimize" id="btn-optimize" onclick="optimize()">FIND OPTIMAL ROUTE</button>

  <!-- ── Loader ── -->
  <div class="loader" id="loader">
    CALCULATING<span>.</span><span>.</span><span>.</span>
  </div>

  <!-- ── Results ── -->
  <div id="results">

    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">Total Distance</div>
        <div class="stat-value" id="stat-km">—<span class="stat-unit">km</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Fuel Needed</div>
        <div class="stat-value" id="stat-liters">—<span class="stat-unit">L</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Est. Fuel Cost</div>
        <div class="stat-value" id="stat-cost">—<span class="stat-unit">PHP</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🗺️ Optimized Route</div>
      <div class="stop-list" id="stop-list"></div>
      <div id="return-chip"></div>
      <a class="btn-maps" id="maps-link" href="#" target="_blank">↗ Open in Google Maps</a>
    </div>

  </div>

</div>

<script>
  function addStop() {
    const list = document.getElementById("location-list");
    const count = list.children.length + 1;
    const row = document.createElement("div");
    row.className = "loc-row";
    row.innerHTML = `<span class="loc-num">${count}.</span><input type="text" placeholder="Enter location"/><button class="btn-remove" onclick="removeStop(this)">✕</button>`;
    list.appendChild(row);
    renumber();
    row.querySelector("input").focus();
  }

  function removeStop(btn) {
    const list = document.getElementById("location-list");
    if (list.children.length <= 2) { alert("Need at least 2 stops."); return; }
    btn.parentElement.remove();
    renumber();
  }

  function renumber() {
    document.querySelectorAll(".loc-num").forEach((el, i) => el.textContent = `${i + 1}.`);
  }

  async function optimize() {
    const inputs    = [...document.querySelectorAll("#location-list input")];
    const locations = inputs.map(i => i.value.trim()).filter(Boolean);
    const startIdx  = parseInt(document.getElementById("start-index").value) - 1;
    const fuelType  = document.getElementById("fuel-type").value;
    const kmL       = parseFloat(document.getElementById("km-per-liter").value);
    const price     = parseFloat(document.getElementById("price-per-liter").value);

    // Reset UI
    document.getElementById("error-box").style.display = "none";
    document.getElementById("results").style.display   = "none";
    document.getElementById("loader").style.display    = "block";
    document.getElementById("btn-optimize").disabled   = true;

    try {
      const res  = await fetch("/optimize", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          locations,
          start_index:     startIdx,
          fuel_type:       fuelType,
          km_per_liter:    kmL,
          price_per_liter: price,
        }),
      });

      const data = await res.json();
      document.getElementById("loader").style.display = "none";

      if (data.error) {
        showError(data.error);
        return;
      }

      // Stats
      document.getElementById("stat-km").innerHTML     = `${data.total_km}<span class="stat-unit">km</span>`;
      document.getElementById("stat-liters").innerHTML = `${data.liters_needed}<span class="stat-unit">L</span>`;
      document.getElementById("stat-cost").innerHTML   = `${data.fuel_cost.toLocaleString()}<span class="stat-unit">PHP</span>`;

      // Stop list
      const stopList = document.getElementById("stop-list");
      stopList.innerHTML = "";
      data.ordered_stops.forEach((stop, i) => {
        const leg  = data.legs[i];
        const isLast = i === data.ordered_stops.length - 1;
        const div  = document.createElement("div");
        div.className = "stop-item";
        div.style.animationDelay = `${i * 0.06}s`;
        div.innerHTML = `
          <div>
            <div class="stop-badge">${i === 0 ? "START" : String(i).padStart(2, "0")}</div>
          </div>
          <div>
            <div class="stop-name">${stop}</div>
            ${!isLast ? `<div class="stop-leg">→ ${leg.km} km to next stop</div>` : ""}
          </div>`;
        stopList.appendChild(div);
      });

      // Return chip
      document.getElementById("return-chip").innerHTML =
        `<div class="return-chip">🔄 Return to ${data.ordered_stops[0]}</div>`;

      // Maps link
      document.getElementById("maps-link").href = data.maps_url;

      document.getElementById("results").style.display = "block";

    } catch (err) {
      document.getElementById("loader").style.display = "none";
      showError("Something went wrong. Check your connection and try again.");
    } finally {
      document.getElementById("btn-optimize").disabled = false;
    }
  }

  function showError(msg) {
    const box = document.getElementById("error-box");
    box.textContent = "⚠ " + msg;
    box.style.display = "block";
  }
</script>
</body>
</html>
